[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "copier-template-github-action-typescript-tests"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
  "copier==9.19.1",
  "langchain-community==0.4.2",
  "langchain-githubcopilot-chat==0.6.1",
  "langchain-core==1.7.3",
  "langchain==1.4.7",
  "pytest==9.2.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["spec"]
python_files = ["*_spec.py"]
addopts = "-ra"
